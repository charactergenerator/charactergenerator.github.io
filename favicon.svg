<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The d20, filled, on a transparent ground so the tab strip shows through
       around the mark. Drawn to match the small sizes inside favicon.ico.

       Filled, not stroked, and that is the part that matters: the version of
       this file that showed nothing on an iPad was a hairline outline, which
       at 16px is a one-pixel ring covering about a quarter of the tile.
       Listboard's generator says the same of its own mark, that an outline
       "collapses into three yellow smudges" at that size. An opaque plate was
       tried behind this as well, but the sibling DM Screen site's tab icons
       are transparent and render on an iPad, so the plate was not the thing.

       A viewBox and nothing else, which is what Listboard declares. Geometry
       is the same hexagon as tools/make-icons.js at 0.78 of the box; keep the
       two in step. -->
  <polygon points="20,5.96 32.168,12.98 32.168,27.02 20,34.04 7.832,27.02 7.832,12.98"
           fill="#22c55e"/>
</svg>
